services:
  - type: web
    name: text-summarization-nlp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader -d nltk_data punkt punkt_tab averaged_perceptron_tagger_eng wordnet omw-1.4
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
